<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A surprise for Mehanaz Riya 🎁</title>
<style>
:root{--bg1:#ffe3ef;--bg2:#e9defd;--card:#ffffffd9;--text:#3b1f4a;--muted:#7a5a8a;--accent:#e83e8c;--accent2:#7c4dff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1030;--bg2:#171233;--card:#2b1f4acc;--text:#fbe9ff;--muted:#c9a8da;--accent:#ff6fb1;--accent2:#a58bff}}
:root[data-theme="dark"]{--bg1:#2a1030;--bg2:#171233;--card:#2b1f4acc;--text:#fbe9ff;--muted:#c9a8da;--accent:#ff6fb1;--accent2:#a58bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;overflow-x:hidden;text-align:center}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
.balloons{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.b{position:absolute;bottom:-120px;width:44px;height:56px;border-radius:50% 50% 48% 48%;opacity:.85;animation:rise linear infinite}
.b::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:40px;background:var(--muted)}
@keyframes rise{to{transform:translateY(-120vh) rotate(8deg)}}
main{position:relative;z-index:2;padding:24px;width:100%;max-width:520px}
.gift{font-size:110px;line-height:1;cursor:pointer;background:none;border:0;animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-14px) scale(1.06)}}
h1{font-size:clamp(28px,8vw,44px);margin:.3em 0}
.hint{color:var(--muted);font-size:18px}
.card{display:none;background:var(--card);backdrop-filter:blur(8px);border-radius:24px;padding:32px 24px;box-shadow:0 12px 40px #0002;animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.name{font-size:clamp(34px,10vw,56px);margin:.1em 0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
.age{display:inline-block;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-radius:999px;padding:6px 18px;font-weight:bold;letter-spacing:1px}
.wish{font-size:19px;line-height:1.6;min-height:5.2em;margin:20px 0}
button.btn{font:inherit;font-size:17px;border:0;border-radius:999px;padding:12px 26px;margin:4px;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 6px 18px #0003}
button.btn:active{transform:scale(.96)}
.date{color:var(--muted);margin-top:14px;font-size:15px}

main.wide{max-width:680px}
body.p2{align-items:flex-start}
.p2sec{display:none;padding:12px 0 40px}
.p2sec .title{font-size:clamp(28px,8vw,44px);margin:.2em 0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:26px 0}
.gal figure{margin:0;background:#fff;padding:8px 8px 22px;border-radius:6px;box-shadow:0 8px 24px #0003;transform:rotate(-2deg);opacity:0;animation:fadeup .8s forwards}
.gal figure:nth-child(even){transform:rotate(2deg)}
.gal figure:first-child{grid-column:1/-1}
.gal figure:nth-child(2){animation-delay:.2s}.gal figure:nth-child(3){animation-delay:.4s}.gal figure:nth-child(4){animation-delay:.6s}.gal figure:nth-child(5){animation-delay:.8s}
.gal img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px}
.gal figure:first-child img{aspect-ratio:4/3}
@keyframes fadeup{from{opacity:0;translate:0 30px}to{opacity:1;translate:0 0}}
.letter{background:var(--card);backdrop-filter:blur(8px);border-radius:24px;padding:28px 22px;text-align:left;box-shadow:0 12px 40px #0002;line-height:1.75;font-size:18px}
.letter p{margin:0 0 14px}
.letter .sig{text-align:right;color:var(--accent);font-style:italic;margin-top:20px}
</style>
</head>
<body>
<div class="balloons" id="balloons"></div>
<canvas id="c"></canvas>
<main>
  <div id="intro">
    <button class="gift" id="gift" aria-label="Open your surprise">🎁</button>
    <h1>A surprise for you…</h1>
    <p class="hint">Tap the gift to open it ✨</p>
  </div>
  <div class="card" id="card">
    <div>🎉🎂🎈</div>
    <p class="hint" style="margin:8px 0 0">Happy Birthday</p>
    <h2 class="name">Mehanaz Riya</h2>
    <span class="age">Turning 20 today!</span>
    <p class="wish" id="wish"></p>
    <button class="btn" id="more">Another wish 💌</button>
    <button class="btn" id="boom">More confetti 🎊</button>
    <button class="btn" id="next">Open my letter 💌</button>
    <p class="date">15 November 2006 → 15 November 2026</p>
  </div>

  
</main>
<script>var wishes=[
"Wishing you a day as bright and beautiful as your smile. Happy Birthday, Riya! 💖",
"May this new year of your life bring you endless joy, success and all the love you deserve. 🌸",
"You make the world around you better just by being in it. Never stop shining! ✨",
"Twenty years of you, and the world is a happier place for it. Enjoy every moment today! 🎂",
"Here’s to laughter, sweet memories and big dreams coming true this year. 🥳",
"Thank you for being such a wonderful friend. I’m so lucky to know you! 🤗"
];
var i=0,timer;
function type(t){var el=document.getElementById('wish');el.textContent='';var n=0;clearInterval(timer);timer=setInterval(function(){el.textContent=t.slice(0,++n);if(n>=t.length)clearInterval(timer)},28)}
var cv=document.getElementById('c'),cx=cv.getContext('2d'),P=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function burst(){var cols=['#ff4d94','#ffd166','#7c4dff','#2ec4b6','#ff8fab','#4cc9f0'];
for(var k=0;k<150;k++){var a=Math.random()*Math.PI*2,s=4+Math.random()*9;
P.push({x:innerWidth/2,y:innerHeight/2.4,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:4+Math.random()*5,c:cols[k%cols.length],l:120+Math.random()*60,rot:Math.random()*6})}
if(!burst.on){burst.on=1;loop()}}
function loop(){cx.clearRect(0,0,cv.width,cv.height);
P=P.filter(function(p){return p.l>0});
P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.99;p.l--;p.rot+=.2;
cx.save();cx.globalAlpha=Math.min(1,p.l/40);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);cx.restore()});
if(P.length)requestAnimationFrame(loop);else burst.on=0}
var bl=document.getElementById('balloons'),bc=['#ff6fb1','#ffd166','#a58bff','#4cc9f0','#ff8fab','#2ec4b6'];
for(var k=0;k<14;k++){var d=document.createElement('div');d.className='b';d.style.left=(Math.random()*95)+'%';d.style.background=bc[k%6];d.style.animationDuration=(9+Math.random()*10)+'s';d.style.animationDelay=(-Math.random()*15)+'s';bl.appendChild(d)}

function go(){location.href='page2.html'}
function showCard(){document.getElementById('intro').style.display='none';document.getElementById('card').style.display='block';type(wishes[0]);burst()}
document.getElementById('gift').onclick=function(){burst();setTimeout(burst,350);setTimeout(go,1100)};
document.getElementById('more').onclick=function(){i=(i+1)%wishes.length;type(wishes[i]);burst()};
document.getElementById('boom').onclick=burst;
document.getElementById('next').onclick=go;
if(location.hash==='#card')showCard();
</script>
</body>
</html>
